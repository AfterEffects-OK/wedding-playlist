<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTunes プレイリスト印刷ツール Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent-amber: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 6px;
        }

        /* Dropzones */
        .dropzones-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .drop-zone {
            flex: 1;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #0f172a80;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone.welcome-zone {
            border-color: #d97706;
            background: rgba(245, 158, 11, 0.05);
        }
        .drop-zone.welcome-zone:hover {
            border-color: var(--accent-amber);
            background: rgba(245, 158, 11, 0.1);
        }

        .drop-zone.main-zone {
            border-color: #0284c7;
            background: rgba(56, 189, 248, 0.05);
        }
        .drop-zone.main-zone:hover {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.1);
        }

        .drop-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .welcome-zone .drop-title { color: var(--accent-amber); }
        .main-zone .drop-title { color: var(--primary); }

        .drop-zone p {
            font-size: 13px;
            color: var(--text-main);
        }
        .drop-zone .sub-text {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
            display: block;
        }

        .file-status {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #334155;
            color: var(--text-sub);
        }
        .file-status.loaded {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
            background: #0f172a;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .input-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .field-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .controls label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
        }

        input[type="text"], input[type="date"], select.time-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="date"]:focus, select.time-select:focus {
            border-color: var(--primary);
        }

        input[type="text"] { width: 320px; }
        select.time-select { width: 130px; font-weight: 600; }

        .btn-print {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }
        .btn-print:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }

        /* Layout */
        .layout-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            width: 100%;
            align-items: stretch;
        }

        .left-panel {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-width: 320px;
        }

        .right-panel {
            flex: 2.8;
            overflow-x: auto;
        }

        .left-panel h3 {
            margin-top: 0;
            font-size: 14px;
            color: var(--primary);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .memo-textarea {
            width: 100%;
            flex-grow: 1;
            min-height: 480px;
            background: var(--card-bg);
            color: #f1f5f9;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 600;
            resize: vertical;
            line-height: 1.6;
            white-space: pre;
            overflow-x: auto;
            outline: none;
        }
        .memo-textarea:focus {
            border-color: var(--primary);
        }

        .print-memo-container { display: none; }

        /* Table */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background: #1e293b;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        td {
            font-size: 16px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 600;
            white-space: nowrap;
        }

        td.song-name-cell {
            font-size: 18px !important;
            font-weight: 700 !important;
            color: #fff;
        }

        tr.draggable-row { cursor: grab; transition: background 0.15s; }
        tr.draggable-row:hover { background: rgba(255, 255, 255, 0.02); }
        tr.draggable-row:active { cursor: grabbing; }
        tr.dragging { opacity: 0.3; background: #334155 !important; }
        tr.drag-over { border-top: 2px solid var(--primary); }

        .drag-handle {
            cursor: grab;
            color: var(--text-sub);
            font-size: 16px;
            user-select: none;
        }

        select.scene-select, select.cue-select {
            background: var(--card-bg);
            color: #7dd3fc;
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 700;
            width: 100%;
            outline: none;
        }

        .print-scene-text, .print-cue-subtext { display: none; }

        .row-action-btn {
            background: #1e3a8a;
            color: #93c5fd;
            border: 1px solid #1e40af;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .row-action-btn:hover { background: #1d4ed8; color: #fff; }

        .row-delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 4px;
            transition: all 0.2s;
        }
        .row-delete-btn:hover { background: var(--danger); color: #fff; }

        .print-header { display: none; }

        /* 印刷用スタイル（1ページに確実に収めるため余白とパディングを調整） */
        @page {
            size: landscape;
            margin: 4mm;
        }

        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: 'Helvetica Neue', Arial, sans-serif;
            }

            .container {
                background: #ffffff !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .dropzones-wrapper, .controls, header, .subtitle, .action-column {
                display: none !important;
            }

            .print-header {
                display: flex !important;
                justify-content: flex-start !important;
                align-items: baseline !important;
                gap: 20px !important;
                color: #000 !important;
                margin-bottom: 4px !important;
                padding-bottom: 2px !important;
                border-bottom: 2px solid #000 !important;
            }

            .print-header .print-datetime {
                margin: 0 !important;
                font-size: 15px !important;
                font-weight: bold !important;
                color: #000 !important;
                white-space: nowrap !important;
            }
            .print-header .print-datetime .num-large {
                font-size: 22px !important;
                font-weight: bold !important;
            }

            .print-header h2 {
                margin: 0 !important;
                font-size: 16px !important;
                color: #000 !important;
                font-weight: normal !important;
                white-space: nowrap !important;
            }
            .print-header h2 .couple-name-large { font-size: 21px !important; font-weight: bold !important; }
            .print-header h2 .honorific-small { font-size: 15px !important; font-weight: normal !important; }

            .layout-wrapper {
                display: flex !important;
                gap: 10px !important;
                width: 100% !important;
                align-items: stretch !important;
                margin-top: 0 !important;
            }

            .left-panel {
                flex: 1 !important;
                background: #ffffff !important;
                border: 1px solid #ddd !important;
                padding: 6px !important;
                border-radius: 0 !important;
            }

            .left-panel h3 {
                color: #000 !important;
                border-bottom: 1px solid #ddd !important;
                font-size: 11px !important;
                margin-bottom: 4px !important;
                padding-bottom: 2px !important;
                font-weight: bold !important;
            }

            .memo-textarea { display: none !important; }
            
            .print-memo-container {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-weight: 700 !important;
                color: #000 !important;
                overflow: hidden !important;
            }

            .right-panel {
                flex: 2.7 !important;
                overflow: visible !important;
            }

            table {
                background: #ffffff !important;
                border: 1px solid #ddd !important;
                width: 100% !important;
                border-radius: 0 !important;
                table-layout: fixed !important;
                border-collapse: collapse !important;
            }

            th, td {
                border: 1px solid #ddd !important;
            }

            th {
                background: #f8fafc !important;
                color: #000 !important;
                padding: 1px 4px !important;
                font-size: 10px !important;
                font-weight: 700 !important;
            }

            th.scene-th, td.scene-td {
                width: 90px !important;
                box-sizing: border-box !important;
            }

            td {
                color: #000 !important;
                padding: 2px 4px !important;
                font-size: 13px !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-weight: 600 !important;
                overflow: hidden !important;
            }

            /* 印刷時：曲名（18px）の下に再生指示（11px・赤色の太字）を表示 */
            td.song-name-cell {
                font-size: 18px !important;
                font-weight: 900 !important;
                color: #000 !important;
                line-height: 1.2 !important;
            }

            .print-cue-subtext {
                display: block !important;
                font-size: 11px !important;
                font-weight: bold !important;
                color: #ef4444 !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                margin-top: 1px !important;
            }

            select.scene-select, select.cue-select { display: none !important; }

            .print-scene-text {
                display: inline-block !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-size: 13px !important;
                font-weight: 700 !important;
                white-space: nowrap !important;
                transform-origin: left center !important;
            }
            .print-scene-text.scale-80 { transform: scaleX(0.8) !important; }
            .print-scene-text.scale-75 { transform: scaleX(0.75) !important; }
            .print-scene-text.scale-100 { transform: scaleX(1.0) !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>iTunes プレイリスト印刷ツール Pro</h1>
            <div class="subtitle">iTunesからエクスポートしたテキストファイルをドラッグ＆ドロップして簡単に印刷用BGM指示書を作成</div>
        </header>

        <div class="dropzones-wrapper">
            <div id="welcome-drop-zone" class="drop-zone welcome-zone">
                <div class="drop-title">📝 迎賓・お見送り用ファイル</div>
                <p>ファイルをドロップまたは選択</p>
                <span class="sub-text">（「迎賓」または「お見送り」のファイル名に対応）</span>
                <div id="welcome-status" class="file-status">未読み込み</div>
                <input type="file" id="welcome-file-input" accept=".txt,.csv" style="display: none;">
            </div>
            <div id="drop-zone" class="drop-zone main-zone">
                <div class="drop-title">♫ メインBGM用ファイル</div>
                <p>ファイルをドロップまたは選択</p>
                <span class="sub-text">（iTunesから書き出した標準テキスト形式 .txt）</span>
                <div id="main-status" class="file-status">未読み込み</div>
                <input type="file" id="file-input" accept=".txt,.csv" style="display: none;">
            </div>
        </div>

        <div class="controls" id="controls-section" style="display: none;">
            <div class="input-group">
                <div class="field-item">
                    <label>挙式・披露宴日</label>
                    <input type="date" id="input-date">
                </div>
                <div class="field-item">
                    <label>開始時間</label>
                    <select id="input-time" class="time-select" onchange="handleTimeChange(this)">
                        <option value="12:00">12:00</option>
                        <option value="17:00">17:00</option>
                        <option value="自由入力...">自由入力...</option>
                    </select>
                </div>
                <div class="field-item">
                    <label>新郎・新婦名 / 宴名</label>
                    <input type="text" id="input-couple" value="本林諒真・竹下由希子">
                </div>
            </div>
            <button class="btn-print" onclick="window.print()">
                <span>🖨️ A4横向きで印刷する</span>
            </button>
        </div>

        <div id="main-content"></div>
    </div>

    <script>
        const SCENE_OPTIONS = [
            "迎賓", "入場", "乾杯準備", "乾杯", "ケーキ準備", "ケーキ入刀", "シェアリング", "歓談",
            "お色直し退場", "中座", "新郎中座", "再入場", "テーブルラウンド", "フォトラウンド", "キャンドル",
            "メイン演出", "新婦手紙", "花束贈呈", "両家代表謝辞", "おひらき", "退場", "送賓", "自由入力..."
        ];

        const CUE_OPTIONS = [
            "頭から", "サビから", "盛り上がりから", "フェードアウト", "自然終了", "曲つなぎ", "自由入力..."
        ];

        const GROUP_MAP = {
            "迎賓": "front", "入場": "front", "乾杯準備": "front", "乾杯": "front", "ケーキ準備": "front", "ケーキ入刀": "front", "シェアリング": "front", "歓談": "front",
            "お色直し退場": "middle_exit", "中座": "middle_exit", "新郎中座": "middle_exit", 
            "再入場": "middle_reentry", "テーブルラウンド": "middle_other", "フォトラウンド": "middle_other", "キャンドル": "middle_other", "メイン演出": "middle_other",
            "新婦手紙": "back", "花束贈呈": "back", "両家代表謝辞": "back", "おひらき": "back", "退場": "back", "送賓": "back"
        };

        let currentRows = [];
        let draggedIndex = null;
        let welcomeMemoContent = "";
        let farewellMemoContent = "";
        let welcomeLoaded = false;
        let farewellLoaded = false;
        let autoInsertTimer = null;

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const welcomeDropZone = document.getElementById('welcome-drop-zone');
        const welcomeFileInput = document.getElementById('welcome-file-input');
        const mainContent = document.getElementById('main-content');
        const controlsSection = document.getElementById('controls-section');

        function generateId() {
            return 'row_' + Math.random().toString(36).substr(2, 9);
        }

        function parseFileNameInfo(fileName) {
            const currentYear = new Date().getFullYear();

            const dateInput = document.getElementById('input-date');
            if (dateInput) {
                const fullDateMatch = fileName.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
                if (fullDateMatch) {
                    const y = fullDateMatch[1];
                    const m = fullDateMatch[2].padStart(2, '0');
                    const d = fullDateMatch[3].padStart(2, '0');
                    dateInput.value = `${y}-${m}-${d}`;
                } else {
                    const mdMatch = fileName.match(/(\d{1,2})[月./\-_](\d{1,2})/);
                    if (mdMatch) {
                        const m = mdMatch[1].padStart(2, '0');
                        const d = mdMatch[2].padStart(2, '0');
                        dateInput.value = `${currentYear}-${m}-${d}`;
                    }
                }
            }

            const coupleInput = document.getElementById('input-couple');
            if (coupleInput) {
                const nameBase = fileName.replace(/\.[^/.]+$/, "");
                const cleaned = nameBase
                    .replace(/^\d{4}[./-]?\d{1,2}[./-]?\d{1,2}[_\s-]*/, '')
                    .replace(/^\d{1,2}[月./\-_]+\d{1,2}[_\s-]*/, '')
                    .replace(/メインBGM|迎賓|お見送り|送賓|プレイリスト/g, '')
                    .trim();

                if (cleaned) {
                    coupleInput.value = cleaned;
                }
            }
            updateHeaderPreview();
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#38bdf8'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#0284c7'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#0284c7';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        welcomeDropZone.addEventListener('click', () => welcomeFileInput.click());
        welcomeDropZone.addEventListener('dragover', (e) => { e.preventDefault(); welcomeDropZone.style.borderColor = '#f59e0b'; });
        welcomeDropZone.addEventListener('dragleave', () => { welcomeDropZone.style.borderColor = '#d97706'; });
        welcomeDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            welcomeDropZone.style.borderColor = '#d97706';
            if (e.dataTransfer.files.length) handleSpecialFile(e.dataTransfer.files[0]);
        });
        welcomeFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleSpecialFile(e.target.files[0]);
        });

        document.getElementById('input-date').addEventListener('input', updateHeaderPreview);
        document.getElementById('input-time').addEventListener('change', updateHeaderPreview);
        document.getElementById('input-couple').addEventListener('input', updateHeaderPreview);

        function handleTimeChange(selectEl) {
            if (selectEl.value === "自由入力...") {
                const custom = prompt("開始時間を入力してください (例: 13:30):", "12:30");
                if (custom) {
                    const newOpt = document.createElement("option");
                    newOpt.value = custom;
                    newOpt.innerText = custom;
                    newOpt.selected = true;
                    selectEl.insertBefore(newOpt, selectEl.lastElementChild);
                    selectEl.value = custom;
                } else {
                    selectEl.value = "12:00";
                }
            }
            updateHeaderPreview();
        }

        function handleSpecialFile(file) {
            const fileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                if (fileName.includes('お見送り') || fileName.includes('送賓')) {
                    parseFarewellData(text);
                } else {
                    parseWelcomeData(text);
                }
                const statusEl = document.getElementById('welcome-status');
                statusEl.innerText = '読み込み完了: ' + fileName;
                statusEl.classList.add('loaded');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function parseWelcomeData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const header = lines[0].split('\t');
            const nameIdx = header.findIndex(h => h.includes('名前') || h.includes('曲名'));
            const artistIdx = header.findIndex(h => h.includes('アーティスト'));

            if (nameIdx === -1) {
                alert('迎賓用ファイルのフォーマットが不整合です。');
                return;
            }

            let textContent = "【迎賓用プレイリスト】\n";
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split('\t');
                const name = cols[nameIdx] || '';
                const artist = artistIdx !== -1 ? (cols[artistIdx] || '') : '';
                if (name) {
                    textContent += `・${name}${artist ? ` / ${artist}` : ''}\n`;
                }
            }

            welcomeMemoContent = textContent;
            welcomeLoaded = true;
            updateMemoTextareaContent();

            if (currentRows.length > 0) syncSpecialRows();
        }

        function parseFarewellData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const header = lines[0].split('\t');
            const nameIdx = header.findIndex(h => h.includes('名前') || h.includes('曲名'));
            const artistIdx = header.findIndex(h => h.includes('アーティスト'));

            if (nameIdx === -1) {
                alert('お見送り用ファイルのフォーマットが不整合です。');
                return;
            }

            let textContent = "\n【お見送り用プレイリスト】\n";
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split('\t');
                const name = cols[nameIdx] || '';
                const artist = artistIdx !== -1 ? (cols[artistIdx] || '') : '';
                if (name) {
                    textContent += `・${name}${artist ? ` / ${artist}` : ''}\n`;
                }
            }

            farewellMemoContent = textContent;
            farewellLoaded = true;
            updateMemoTextareaContent();

            if (currentRows.length > 0) syncSpecialRows();
        }

        function updateMemoTextareaContent() {
            const memoTextarea = document.querySelector('.memo-textarea');
            const combined = (welcomeMemoContent + "\n" + farewellMemoContent).trim();
            if (memoTextarea) {
                memoTextarea.value = combined;
                updatePrintMemoBox(memoTextarea);
            }
        }

        function syncSpecialRows() {
            if (welcomeLoaded) {
                if (currentRows.length > 0 && currentRows[0].isBlank) {
                    currentRows[0].name = "";
                    currentRows[0].artist = "（迎賓プレイリストあり）";
                    currentRows[0].scene = "迎賓";
                } else {
                    const hasWelcomeRow = currentRows.some(r => r.scene === "迎賓" && r.artist.includes('プレイリストあり'));
                    if (!hasWelcomeRow) {
                        currentRows.unshift({
                            id: generateId(),
                            name: "",
                            artist: "（迎賓プレイリストあり）",
                            scene: "迎賓",
                            cue: "",
                            isBlank: false
                        });
                    }
                }
            }
            if (farewellLoaded) {
                const hasFarewellRow = currentRows.some(r => r.scene === "送賓" || r.artist.includes('お見送り'));
                if (!hasFarewellRow) {
                    currentRows.push({
                        id: generateId(),
                        name: "",
                        artist: "（お見送りプレイリストあり）",
                        scene: "送賓",
                        cue: "",
                        isBlank: false
                    });
                }
            }
            autoInsertGroupBlankRows();
            renderUI();
        }

        function handleFile(file) {
            parseFileNameInfo(file.name);

            const reader = new FileReader();
            reader.onload = function(e) {
                parseData(e.target.result);
                const statusEl = document.getElementById('main-status');
                statusEl.innerText = '読み込み完了: ' + file.name;
                statusEl.classList.add('loaded');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function parseData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                alert('有効なデータが見つかりませんでした。');
                return;
            }

            const header = lines[0].split('\t');
            const nameIdx = header.findIndex(h => h.includes('名前') || h.includes('曲名'));
            const artistIdx = header.findIndex(h => h.includes('アーティスト'));

            if (nameIdx === -1) {
                alert('必要な列が見つかりません。iTunesの標準エクスポート形式（.txt）を選択してください。');
                return;
            }

            currentRows = [];

            if (welcomeLoaded) {
                currentRows.push({
                    id: generateId(),
                    name: "",
                    artist: "（迎賓プレイリストあり）",
                    scene: "迎賓",
                    cue: "",
                    isBlank: false
                });
            }

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split('\t');
                const name = cols[nameIdx] || '';
                const artist = artistIdx !== -1 ? (cols[artistIdx] || '') : '';

                if (name) {
                    currentRows.push({ id: generateId(), name, artist, scene: "", cue: "", isBlank: false });
                }
            }

            if (farewellLoaded) {
                currentRows.push({
                    id: generateId(),
                    name: "",
                    artist: "（お見送りプレイリストあり）",
                    scene: "送賓",
                    cue: "",
                    isBlank: false
                });
            }

            autoInsertGroupBlankRows();
            renderUI();
            controlsSection.style.display = 'flex';
        }

        function autoInsertGroupBlankRows() {
            let cleanRows = currentRows.filter(r => !r.isBlank);
            let hasWelcome = cleanRows.some(r => r.scene === "迎賓");
            let newRows = [];

            for (let i = 0; i < cleanRows.length; i++) {
                const curr = cleanRows[i];
                const prev = i > 0 ? cleanRows[i - 1] : null;

                if (!hasWelcome && curr.scene === "入場") {
                    if (newRows.length === 0 || !newRows[newRows.length - 1].isBlank) {
                        newRows.push({ id: generateId(), name: "", artist: "", scene: "", cue: "", isBlank: true });
                    }
                } else if (prev) {
                    const prevGroup = GROUP_MAP[prev.scene] || null;
                    const currGroup = GROUP_MAP[curr.scene] || null;

                    if (prevGroup && currGroup && prevGroup !== currGroup) {
                        if (newRows.length === 0 || !newRows[newRows.length - 1].isBlank) {
                            newRows.push({ id: generateId(), name: "", artist: "", scene: "", cue: "", isBlank: true });
                        }
                    }
                }
                newRows.push(curr);
            }
            currentRows = newRows;
        }

        function insertBlankRow(index) {
            saveCurrentInputs();
            currentRows.splice(index + 1, 0, { id: generateId(), name: "", artist: "", scene: "", cue: "", isBlank: true });
            renderUI();
        }

        function removeRow(index) {
            saveCurrentInputs();
            currentRows.splice(index, 1);
            renderUI();
        }

        function saveCurrentInputs() {
            const memoTextarea = document.querySelector('.memo-textarea');
            if (memoTextarea) {
                welcomeMemoContent = memoTextarea.value;
            }

            const rows = document.querySelectorAll('#playlist-tbody tr');
            rows.forEach((tr) => {
                const rowId = tr.getAttribute('data-id');
                if (rowId) {
                    const rowData = currentRows.find(r => r.id === rowId);
                    if (rowData && !rowData.isBlank) {
                        const sceneSelect = tr.querySelector('.scene-select');
                        const cueSelect = tr.querySelector('.cue-select');
                        if (sceneSelect) rowData.scene = sceneSelect.value;
                        if (cueSelect) rowData.cue = cueSelect.value;
                    }
                }
            });
        }

        function getHeaderText() {
            const dateVal = document.getElementById('input-date').value;
            const timeVal = document.getElementById('input-time').value;
            const coupleVal = document.getElementById('input-couple').value;
            
            let processedCouple = coupleVal.trim();
            if (processedCouple) {
                if (!processedCouple.includes('様')) {
                    processedCouple = processedCouple.replace(/([・\s]+)/g, '<span class="honorific-small">様</span>$1') + '<span class="honorific-small">様</span>';
                } else {
                    processedCouple = processedCouple.replace(/様/g, '<span class="honorific-small">様</span>');
                }
            }

            const coupleText = `<span class="couple-name-large">${processedCouple}</span> 披露宴BGMプレイリスト`;
            
            let formattedDate = dateVal;
            if (dateVal) {
                const parts = dateVal.split('-');
                if (parts.length === 3) {
                    formattedDate = `<span class="num-large">${parseInt(parts[1])}</span>月<span class="num-large">${parseInt(parts[2])}</span>日`;
                }
            }

            let formattedTime = timeVal;
            if (timeVal) {
                const timeParts = timeVal.split(':');
                if (timeParts.length === 2) {
                    formattedTime = `<span class="num-large">${timeParts[0]}</span>:<span class="num-large">${timeParts[1]}</span>`;
                }
            }

            const dateTimeText = (formattedDate || formattedTime) ? `${formattedDate} ${formattedTime}` : '';
            return { coupleText, dateTimeText };
        }

        function updateHeaderPreview() {
            const h2El = document.getElementById('display-title');
            const pEl = document.getElementById('display-datetime');
            if (h2El && pEl) {
                const info = getHeaderText();
                h2El.innerHTML = info.coupleText;
                pEl.innerHTML = info.dateTimeText;
            }
        }

        function updatePrintMemoBox(textarea) {
            const printBox = document.querySelector('.print-memo-container');
            if (!printBox) return;

            const lines = textarea.value.split('\n');
            const containerWidth = 260;

            let baseFontSize = 13;
            let minFontSize = 7;
            let htmlContent = '';
            
            const measureSpan = document.createElement('span');
            measureSpan.style.visibility = 'hidden';
            measureSpan.style.position = 'absolute';
            measureSpan.style.whiteSpace = 'pre';
            measureSpan.style.fontFamily = "'Klee One', cursive, sans-serif";
            document.body.appendChild(measureSpan);

            for (let line of lines) {
                if (!line) {
                    htmlContent += '<div style="height: 10px;"></div>';
                    continue;
                }

                measureSpan.innerText = line;
                let currentSize = baseFontSize;
                measureSpan.style.fontSize = currentSize + 'px';

                while (measureSpan.offsetWidth > containerWidth && currentSize > minFontSize) {
                    currentSize -= 0.5;
                    measureSpan.style.fontSize = currentSize + 'px';
                }

                htmlContent += `<div style="font-size: ${currentSize}px; white-space: pre; line-height: 1.35; overflow: hidden; text-overflow: clip;">${escapeHtml(line)}</div>`;
            }

            document.body.removeChild(measureSpan);
            printBox.innerHTML = htmlContent;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getSceneScaleClass(text) {
            if (!text) return 'scale-100';
            if (text.length >= 8) return 'scale-75';
            if (text.length >= 6) return 'scale-80';
            return 'scale-100';
        }

        function renderUI() {
            saveCurrentInputs();
            const info = getHeaderText();
            let optionsHtml = SCENE_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            let cueOptionsHtml = CUE_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join('');

            let html = `
                <div class="print-header">
                    <div id="display-datetime" class="print-datetime">${info.dateTimeText}</div>
                    <h2 id="display-title">${info.coupleText}</h2>
                </div>
                
                <div class="layout-wrapper">
                    <div class="left-panel">
                        <h3>その他プレイリスト・メモ欄</h3>
                        <textarea class="memo-textarea" placeholder="ここに迎賓曲や演出メモを自由に記入できます...">${welcomeMemoContent || (welcomeMemoContent + "\n" + farewellMemoContent).trim()}</textarea>
                        <div class="print-memo-container"></div>
                    </div>

                    <div class="right-panel">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 32px;" class="action-column"></th>
                                    <th class="scene-th">シーン</th>
                                    <th>曲名</th>
                                    <th>アーティスト</th>
                                    <th style="width: 120px; text-align: center;" class="action-column">操作</th>
                                </tr>
                            </thead>
                            <tbody id="playlist-tbody">
            `;

            currentRows.forEach((r, idx) => {
                if (r.isBlank) {
                    html += `
                        <tr class="draggable-row" draggable="true" data-id="${r.id}" data-index="${idx}" style="height: 38px; background: rgba(255,255,255,0.01);">
                            <td class="text-center action-column"><span class="drag-handle">☰</span></td>
                            <td class="scene-td"></td>
                            <td></td>
                            <td></td>
                            <td style="text-align: center;" class="action-column">
                                <button class="row-delete-btn" onclick="removeRow(${idx})">削除</button>
                            </td>
                        </tr>
                    `;
                } else {
                    const sceneText = r.scene || '';
                    const scaleClass = getSceneScaleClass(sceneText);
                    const cueText = r.cue || '';

                    html += `
                        <tr class="draggable-row" draggable="true" data-id="${r.id}" data-index="${idx}">
                            <td class="text-center action-column"><span class="drag-handle">☰</span></td>
                            <td class="scene-td">
                                <select class="scene-select" onchange="handleSceneChange(this, ${idx})">
                                    <option value="">(選択)</option>
                                    ${optionsHtml}
                                </select>
                                <span class="print-scene-text ${scaleClass}">${sceneText}</span>
                            </td>
                            <td class="song-name-cell">
                                <div>${r.name}</div>
                                <span class="print-cue-subtext">${cueText}</span>
                                <div style="margin-top: 4px;">
                                    <select class="cue-select" onchange="updateCustomText(this, 'cue', ${idx})">
                                        <option value="">(再生指示なし)</option>
                                        ${cueOptionsHtml}
                                    </select>
                                </div>
                            </td>
                            <td style="color: #cbd5e1;">${r.artist}</td>
                            <td style="text-align: center; white-space: nowrap;" class="action-column">
                                <button class="row-action-btn" onclick="insertBlankRow(${idx})">＋空白</button>
                                <button class="row-delete-btn" onclick="removeRow(${idx})">削除</button>
                            </td>
                        </tr>
                    `;
                }
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            mainContent.innerHTML = html;

            const memoTextarea = document.querySelector('.memo-textarea');
            if (memoTextarea) {
                memoTextarea.addEventListener('input', function() {
                    updatePrintMemoBox(this);
                });
                setTimeout(() => updatePrintMemoBox(memoTextarea), 50);
            }

            currentRows.forEach((r, idx) => {
                if (!r.isBlank) {
                    const tr = document.querySelector(`tr[data-id="${r.id}"]`);
                    if (tr) {
                        const sceneSelect = tr.querySelector('.scene-select');
                        const cueSelect = tr.querySelector('.cue-select');
                        if (sceneSelect && r.scene) {
                            if (!Array.from(sceneSelect.options).some(o => o.value === r.scene)) {
                                const customOpt = document.createElement("option");
                                customOpt.value = r.scene;
                                customOpt.innerText = r.scene;
                                customOpt.selected = true;
                                sceneSelect.insertBefore(customOpt, sceneSelect.lastElementChild);
                            }
                            sceneSelect.value = r.scene;
                            const spanEl = sceneSelect.nextElementSibling;
                            spanEl.innerText = r.scene;
                            spanEl.className = `print-scene-text ${getSceneScaleClass(r.scene)}`;
                        }
                        if (cueSelect && r.cue) {
                            if (!Array.from(cueSelect.options).some(o => o.value === r.cue)) {
                                const customOpt = document.createElement("option");
                                customOpt.value = r.cue;
                                customOpt.innerText = r.cue;
                                customOpt.selected = true;
                                cueSelect.insertBefore(customOpt, cueSelect.lastElementChild);
                            }
                            cueSelect.value = r.cue;
                        }
                    }
                }
            });

            initDragAndDrop();
        }

        function handleSceneChange(selectEl, idx) {
            updateCustomText(selectEl, 'scene', idx);

            if (autoInsertTimer) clearTimeout(autoInsertTimer);

            autoInsertTimer = setTimeout(() => {
                saveCurrentInputs();
                autoInsertGroupBlankRows();
                renderUI();
            }, 250);
        }

        function updateCustomText(selectEl, type, idx) {
            const promptMsg = type === 'scene' ? "シーン名を入力してください:" : "再生指示を入力してください:";
            
            if (selectEl.value === "自由入力...") {
                const custom = prompt(promptMsg, "");
                if (custom) {
                    const newOpt = document.createElement("option");
                    newOpt.value = custom;
                    newOpt.innerText = custom;
                    newOpt.selected = true;
                    selectEl.insertBefore(newOpt, selectEl.lastElementChild);
                    
                    if (type === 'scene') {
                        currentRows[idx].scene = custom;
                        const spanEl = selectEl.nextElementSibling;
                        spanEl.innerText = custom;
                        spanEl.className = `print-scene-text ${getSceneScaleClass(custom)}`;
                    }
                    if (type === 'cue') {
                        currentRows[idx].cue = custom;
                        const tr = selectEl.closest('tr');
                        const cueSubSpan = tr.querySelector('.print-cue-subtext');
                        if (cueSubSpan) cueSubSpan.innerText = custom;
                    }
                } else {
                    selectEl.value = "";
                    if (type === 'scene') {
                        currentRows[idx].scene = "";
                        const spanEl = selectEl.nextElementSibling;
                        spanEl.innerText = "";
                        spanEl.className = "print-scene-text scale-100";
                    }
                    if (type === 'cue') {
                        currentRows[idx].cue = "";
                        const tr = selectEl.closest('tr');
                        const cueSubSpan = tr.querySelector('.print-cue-subtext');
                        if (cueSubSpan) cueSubSpan.innerText = "";
                    }
                }
            } else {
                if (type === 'scene') {
                    currentRows[idx].scene = selectEl.value;
                    const spanEl = selectEl.nextElementSibling;
                    spanEl.innerText = selectEl.value;
                    spanEl.className = `print-scene-text ${getSceneScaleClass(selectEl.value)}`;
                }
                if (type === 'cue') {
                    currentRows[idx].cue = selectEl.value;
                    const tr = selectEl.closest('tr');
                    const cueSubSpan = tr.querySelector('.print-cue-subtext');
                    if (cueSubSpan) cueSubSpan.innerText = selectEl.value;
                }
            }
        }

        function initDragAndDrop() {
            const tbody = document.getElementById('playlist-tbody');
            if (!tbody) return;
            const rows = tbody.querySelectorAll('tr.draggable-row');

            rows.forEach(row => {
                row.addEventListener('dragstart', (e) => {
                    draggedIndex = parseInt(row.getAttribute('data-index'));
                    setTimeout(() => row.classList.add('dragging'), 0);
                });

                row.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    rows.forEach(r => r.classList.remove('drag-over'));
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const targetRow = e.target.closest('tr');
                    if (targetRow && targetRow !== row) {
                        rows.forEach(r => r.classList.remove('drag-over'));
                        targetRow.classList.add('drag-over');
                    }
                });

                row.addEventListener('drop', (e) => {
                    e.preventDefault();
                    saveCurrentInputs();
                    const targetRow = e.target.closest('tr');
                    if (targetRow) {
                        const targetIndex = parseInt(targetRow.getAttribute('data-index'));
                        if (draggedIndex !== null && draggedIndex !== targetIndex) {
                            const movedItem = currentRows.splice(draggedIndex, 1)[0];
                            currentRows.splice(targetIndex, 0, movedItem);
                            renderUI();
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
