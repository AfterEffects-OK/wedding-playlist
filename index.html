<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTunes プレイリスト印刷ツール Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent-amber: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 6px;
        }

        /* Dropzones */
        .dropzones-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .drop-zone {
            flex: 1;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #0f172a80;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone.welcome-zone {
            border-color: #d97706;
            background: rgba(245, 158, 11, 0.05);
        }
        .drop-zone.welcome-zone:hover {
            border-color: var(--accent-amber);
            background: rgba(245, 158, 11, 0.1);
        }

        .drop-zone.main-zone {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        .drop-zone.main-zone:hover {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.1);
        }

        .drop-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .welcome-zone .drop-title { color: var(--accent-amber); }
        .main-zone .drop-title { color: var(--primary); }

        .drop-zone p {
            font-size: 13px;
            color: var(--text-main);
        }
        .drop-zone .sub-text {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
            display: block;
        }

        .file-status {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #334155;
            color: var(--text-sub);
        }
        .file-status.loaded {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
            background: #0f172a;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .input-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .field-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .controls label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
        }

        input[type="text"], input[type="date"], input[type="number"], select.time-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select.time-select:focus {
            border-color: var(--primary);
        }

        input[type="text"] { width: 320px; }
        input[type="number"].media-count-input { width: 85px; text-align: center; font-weight: 600; }
        select.time-select { width: 130px; font-weight: 600; }

        .btn-print {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }
        .btn-print:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }

        /* Layout */
        .layout-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            width: 100%;
            align-items: stretch;
        }

        .left-panel {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-width: 320px;
        }

        .right-panel {
            flex: 2.8;
            overflow-x: auto;
        }

        .left-panel h3 {
            margin-top: 0;
            font-size: 14px;
            color: var(--primary);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .memo-textarea {
            width: 100%;
            flex-grow: 1;
            min-height: 480px;
            background: var(--card-bg);
            color: #f1f5f9;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 600;
            resize: vertical;
            line-height: 1.6;
            white-space: pre;
            overflow-x: auto;
            outline: none;
        }
        .memo-textarea:focus {
            border-color: var(--primary);
        }

        .print-memo-container { display: none; }

        /* Table */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background: #1e293b;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        td {
            font-size: 16px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 600;
        }

        input.song-name-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        input.song-name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        input.artist-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        input.artist-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .print-song-name, .print-artist-text { display: none; }

        tr.draggable-row { transition: background 0.15s; }
        tr.draggable-row:hover { background: rgba(255, 255, 255, 0.02); }
        tr.dragging { opacity: 0.3; background: #334155 !important; }
        tr.drag-over { border-top: 2px solid var(--primary); }

        .drag-handle {
            cursor: grab;
            color: var(--text-sub);
            font-size: 16px;
            user-select: none;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        select.scene-select, select.cue-select {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Klee One', cursive, sans-serif;
            font-weight: 700;
            width: 100%;
            outline: none;
        }
        select.scene-select:focus, select.cue-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .print-scene-text, .print-cue-subtext { display: none; }

        .row-action-btn {
            background: #1e3a8a;
            color: #93c5fd;
            border: 1px solid #1e40af;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .row-action-btn:hover { background: #1d4ed8; color: #fff; }

        .row-delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 4px;
            transition: all 0.2s;
        }
        .row-delete-btn:hover { background: var(--danger); color: #fff; }

        /* カスタムモーダルウィンドウ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 14px;
            width: 520px;
            max-width: 90vw;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box h3 {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 14px;
            font-weight: 700;
        }
        .modal-field {
            margin-bottom: 14px;
        }
        .modal-field label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .modal-field input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .modal-field input[type="text"]:focus {
            border-color: var(--primary);
        }

        /* 選択式ボタンエリア（チップ） */
        .cue-chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            min-height: 55px;
            align-items: center;
        }
        .cue-chip-btn {
            background: #334155;
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .cue-chip-btn:hover {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }
        .cue-chip-btn.time-chip {
            background: #0369a1;
            border-color: #38bdf8;
            color: #f0f9ff;
        }

        /* 順序入れ替え可能なリストエリア */
        .sequence-list-box {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
            min-height: 48px;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sequence-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
        }
        .seq-btn-group {
            display: flex;
            gap: 4px;
        }
        .seq-move-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .seq-move-btn:hover {
            background: var(--primary);
            color: #0f172a;
        }
        .seq-del-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .seq-del-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        .seq-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .clear-seq-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        /* 時間指定ビルダー用エリア */
        .time-builder-box {
            background: #0f172a;
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        .time-builder-box.active {
            display: block;
        }
        .time-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .time-input-row input {
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            outline: none;
        }
        .time-input-row span {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            white-space: nowrap;
        }

        /* 定型ワードタグボタン */
        .preset-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 6px;
        }
        .preset-tag-btn {
            background: #1e293b;
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-tag-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.1);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .modal-btn.cancel {
            background: #334155;
            color: var(--text-sub);
        }
        .modal-btn.cancel:hover { background: #475569; color: #fff; }
        .modal-btn.submit {
            background: var(--primary);
            color: #0f172a;
        }
        .modal-btn.submit:hover { background: #7dd3fc; }

        .print-header { display: none; }

        /* 印刷用スタイル */
        @page {
            size: landscape;
            margin: 3mm;
        }

        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: 'Helvetica Neue', Arial, sans-serif;
                height: 100vh !important;
                overflow: hidden !important;
            }

            .container {
                background: #ffffff !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .dropzones-wrapper, .controls, header, .subtitle, .action-column, .modal-overlay {
                display: none !important;
            }

            .print-header {
                display: flex !important;
                justify-content: flex-start !important;
                align-items: baseline !important;
                gap: 20px !important;
                color: #000 !important;
                margin-bottom: 2px !important;
                padding-bottom: 2px !important;
                border-bottom: 2px solid #000 !important;
            }

            .print-header .print-datetime {
                margin: 0 !important;
                font-size: 14px !important;
                font-weight: bold !important;
                color: #000 !important;
                white-space: nowrap !important;
            }
            .print-header .print-datetime .num-large {
                font-size: 20px !important;
                font-weight: bold !important;
            }

            .print-header h2 {
                margin: 0 !important;
                font-size: 15px !important;
                color: #000 !important;
                font-weight: normal !important;
                white-space: nowrap !important;
                display: flex !important;
                align-items: baseline !important;
            }
            .print-header h2 .couple-name-large { font-size: 20px !important; font-weight: bold !important; }
            .print-header h2 .honorific-small { font-size: 14px !important; font-weight: normal !important; }

            .print-header .return-cd-print {
                margin-left: 40px !important;
                font-size: 14px !important;
                font-weight: bold !important;
                color: #000 !important;
                white-space: nowrap !important;
            }
            .print-header .return-cd-print .cd-num-large {
                font-size: 18px !important;
                font-weight: bold !important;
            }

            .layout-wrapper {
                display: flex !important;
                gap: 8px !important;
                width: 100% !important;
                align-items: stretch !important;
                margin-top: 0 !important;
            }

            .left-panel {
                flex: 1 !important;
                background: #ffffff !important;
                border: 1px solid #ddd !important;
                padding: 4px !important;
                border-radius: 0 !important;
            }

            .left-panel h3 {
                color: #000 !important;
                border-bottom: 1px solid #ddd !important;
                font-size: 10px !important;
                margin-bottom: 2px !important;
                padding-bottom: 2px !important;
                font-weight: bold !important;
            }

            .memo-textarea { display: none !important; }
            
            .print-memo-container {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-weight: 700 !important;
                color: #000 !important;
                overflow: hidden !important;
            }

            .right-panel {
                flex: 2.7 !important;
                overflow: visible !important;
            }

            table {
                background: #ffffff !important;
                border: 1px solid #ddd !important;
                width: 100% !important;
                border-radius: 0 !important;
                table-layout: auto !important;
                border-collapse: collapse !important;
            }

            th, td {
                border: 1px solid #ddd !important;
            }

            th {
                background: #f8fafc !important;
                color: #000 !important;
                padding: 1px 3px !important;
                font-size: 10px !important;
                font-weight: 700 !important;
            }

            th.scene-th, td.scene-td {
                width: 85px !important;
                max-width: 85px !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
            }

            th.song-th, td.song-name-cell {
                width: 1%;
                white-space: nowrap !important;
                max-width: 320px !important;
                box-sizing: border-box !important;
            }

            td {
                color: #000 !important;
                padding: 2px 3px !important;
                font-size: 12px !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-weight: 600 !important;
                overflow: hidden !important;
            }

            input.song-name-input, input.artist-input { display: none !important; }

            .print-song-name {
                display: inline-block !important;
                font-size: 17px !important;
                font-weight: 900 !important;
                color: #000 !important;
                line-height: 1.15 !important;
                white-space: nowrap !important;
                transform-origin: left center !important;
            }

            .print-artist-text {
                display: block !important;
                font-size: 12px !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-weight: 600 !important;
                color: #000 !important;
            }

            .print-cue-subtext {
                display: block !important;
                font-size: 11px !important;
                font-weight: 900 !important;
                color: #dc2626 !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                margin-top: 1px !important;
            }

            select.scene-select, select.cue-select { display: none !important; }

            .print-scene-text {
                display: inline-block !important;
                font-family: 'Klee One', cursive, sans-serif !important;
                font-size: 12px !important;
                font-weight: 700 !important;
                white-space: nowrap !important;
                transform-origin: left center !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>iTunes プレイリスト印刷ツール Pro</h1>
            <div class="subtitle">iTunesからエクスポートしたテキストファイルをドラッグ＆ドロップして簡単に印刷用BGM指示書を作成</div>
        </header>

        <div class="dropzones-wrapper">
            <div id="welcome-drop-zone" class="drop-zone welcome-zone">
                <div class="drop-title">📝 迎賓・お見送り用ファイル</div>
                <p>ファイルをドロップまたは選択</p>
                <span class="sub-text">（「迎賓」または「お見送り」のファイル名に対応）</span>
                <div id="welcome-status" class="file-status">未読み込み</div>
                <input type="file" id="welcome-file-input" accept=".txt,.csv" style="display: none;">
            </div>
            <div id="drop-zone" class="drop-zone main-zone">
                <div class="drop-title">♫ メインBGM用ファイル</div>
                <p>ファイルをドロップまたは選択</p>
                <span class="sub-text">（iTunesから書き出した標準テキスト形式 .txt）</span>
                <div id="main-status" class="file-status">未読み込み</div>
                <input type="file" id="file-input" accept=".txt,.csv" style="display: none;">
            </div>
        </div>

        <div class="controls" id="controls-section" style="display: none;">
            <div class="input-group">
                <div class="field-item">
                    <label>挙式・披露宴日</label>
                    <input type="date" id="input-date">
                </div>
                <div class="field-item">
                    <label>開始時間</label>
                    <select id="input-time" class="time-select" onchange="handleTimeChange(this)">
                        <option value="12:00">12:00</option>
                        <option value="17:00">17:00</option>
                        <option value="自由入力...">自由入力...</option>
                    </select>
                </div>
                <div class="field-item">
                    <label>新郎・新婦名 / 宴名</label>
                    <input type="text" id="input-couple" value="本林諒真・竹下由希子">
                </div>
                <div class="field-item">
                    <label>返却CD枚数</label>
                    <input type="number" id="input-cd-count" class="media-count-input" min="0" value="0" placeholder="0">
                </div>
                <div class="field-item">
                    <label>返却DVD枚数</label>
                    <input type="number" id="input-dvd-count" class="media-count-input" min="0" value="0" placeholder="0">
                </div>
            </div>
            <button class="btn-print" onclick="window.print()">
                <span>🖨️ A4横向きで印刷する</span>
            </button>
        </div>

        <div id="main-content"></div>
    </div>

    <!-- カスタム指示モーダル -->
    <div id="time-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>🎛️ 再生指示の組み合わせ・順番設定</h3>

            <div class="modal-field">
                <label>基本指示（クリックするとリストに追加されます）</label>
                <div class="cue-chip-container" id="cue-chips-container">
                    <button type="button" class="cue-chip-btn" onclick="addStandardCue('頭から')">頭から</button>
                    <button type="button" class="cue-chip-btn" onclick="addStandardCue('サビから')">サビから</button>
                    <button type="button" class="cue-chip-btn" onclick="addStandardCue('盛り上がりから')">盛り上がりから</button>
                    <button type="button" class="cue-chip-btn" onclick="addStandardCue('フェードアウト')">フェードアウト</button>
                    <button type="button" class="cue-chip-btn" onclick="addStandardCue('自然終了')">自然終了</button>
                    <button type="button" class="cue-chip-btn" onclick="addStandardCue('曲つなぎ')">曲つなぎ</button>
                    <button type="button" class="cue-chip-btn time-chip" onclick="toggleTimeBuilder()">⏱️ ＋時間指定の追加</button>
                </div>

                <!-- 時間指定をその場ですばやく追加するビルダーボックス -->
                <div class="time-builder-box" id="time-builder-box">
                    <label style="color: var(--primary); margin-bottom: 6px;">時間指定の作成</label>
                    <div class="time-input-row">
                        <input type="number" id="builder-min-input" placeholder="0" min="0" value="0" style="width: 55px;">
                        <span>分</span>
                        <input type="number" id="builder-sec-input" placeholder="16" min="0" max="59" value="16" style="width: 55px;">
                        <span>秒 ～</span>
                        <input type="text" id="builder-keyword-input" placeholder="キーワード" value="オープン" style="flex: 1;">
                    </div>
                    <div class="preset-tags">
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('オープン')">オープン</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('ドアオープン')">ドアオープン</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('再生')">再生</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('入刀')">入刀</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('メイン')">メイン</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('贈呈')">贈呈</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('入場')">入場</button>
                        <button type="button" class="preset-tag-btn" onclick="selectPresetWord('退場')">退場</button>
                    </div>
                    <div style="text-align: right; margin-top: 8px;">
                        <button type="button" class="modal-btn submit" style="padding: 4px 12px; font-size: 12px;" onclick="commitTimeCue()">この時間指定を追加</button>
                    </div>
                </div>

                <div class="seq-header-bar">
                    <label style="font-size: 11px; color: var(--text-sub); margin: 0;">設定中の指示リスト（↑↓ボタンで順序変更可能）：</label>
                    <button type="button" class="clear-seq-btn" onclick="clearSequence()">全クリア</button>
                </div>
                
                <div class="sequence-list-box" id="sequence-list-box">
                    <!-- JSで動的生成 -->
                </div>
            </div>

            <div class="modal-field">
                <label>その他のメモ・自由記述</label>
                <input type="text" id="modal-free-input" placeholder="例: 2番サビから大サビへカット">
            </div>

            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeTimeModal(false)">キャンセル</button>
                <button class="modal-btn submit" onclick="closeTimeModal(true)">決定</button>
            </div>
        </div>
    </div>

    <script>
        const SCENE_OPTIONS = [
            "迎賓", "入場", "乾杯準備", "乾杯", "ケーキ準備", "ケーキ入刀", "シェアリング", "歓談",
            "お色直し退場", "中座", "新郎中座", "再入場", "テーブルラウンド", "フォトラウンド", "キャンドル",
            "メイン演出", "新婦手紙", "花束贈呈", "両家代表謝辞", "おひらき", "退場", "送賓", "自由入力..."
        ];

        const CUE_OPTIONS = [
            "頭から", "サビから", "盛り上がりから", "フェードアウト", "自然終了", "曲つなぎ", "時間指定 / 複数選択...", "指示をクリア"
        ];

        const GROUP_MAP = {
            "迎賓": "front", "入場": "front", "乾杯準備": "front", "乾杯": "front", "ケーキ準備": "front", "ケーキ入刀": "front", "シェアリング": "front", "歓談": "front",
            "お色直し退場": "middle_exit", "中座": "middle_exit", "新郎中座": "middle_exit", 
            "再入場": "middle_reentry", "テーブルラウンド": "middle_other", "フォトラウンド": "middle_other", "キャンドル": "middle_other", "メイン演出": "middle_other",
            "新婦手紙": "back", "花束贈呈": "back", "両家代表謝辞": "back", "おひらき": "back", "退場": "back", "送賓": "back"
        };

        let currentRows = [];
        let draggedIndex = null;
        let welcomeMemoContent = "";
        let farewellMemoContent = "";
        let welcomeLoaded = false;
        let farewellLoaded = false;
        let autoInsertTimer = null;
        let memoDebounceTimer = null;

        let activeTimeSelectEl = null;
        let activeTimeRowIdx = null;
        let selectedCueSequence = [];

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const welcomeDropZone = document.getElementById('welcome-drop-zone');
        const welcomeFileInput = document.getElementById('welcome-file-input');
        const mainContent = document.getElementById('main-content');
        const controlsSection = document.getElementById('controls-section');

        function generateId() {
            return 'row_' + Math.random().toString(36).substr(2, 9);
        }

        function parseFileNameInfo(fileName) {
            const currentYear = new Date().getFullYear();

            const dateInput = document.getElementById('input-date');
            if (dateInput) {
                const fullDateMatch = fileName.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
                if (fullDateMatch) {
                    const y = fullDateMatch[1];
                    const m = fullDateMatch[2].padStart(2, '0');
                    const d = fullDateMatch[3].padStart(2, '0');
                    dateInput.value = `${y}-${m}-${d}`;
                } else {
                    const mdMatch = fileName.match(/(\d{1,2})[月./\-_](\d{1,2})/);
                    if (mdMatch) {
                        const m = mdMatch[1].padStart(2, '0');
                        const d = mdMatch[2].padStart(2, '0');
                        dateInput.value = `${currentYear}-${m}-${d}`;
                    }
                }
            }

            const coupleInput = document.getElementById('input-couple');
            if (coupleInput) {
                const nameBase = fileName.replace(/\.[^/.]+$/, "");
                const cleaned = nameBase
                    .replace(/^\d{4}[./-]?\d{1,2}[./-]?\d{1,2}[_\s-]*/, '')
                    .replace(/^\d{1,2}[月./\-_]+\d{1,2}[_\s-]*/, '')
                    .replace(/メインBGM|迎賓|お見送り|送賓|プレイリスト/g, '')
                    .trim();

                if (cleaned) {
                    coupleInput.value = cleaned;
                }
            }
            updateHeaderPreview();
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#38bdf8'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#0284c7'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#0284c7';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        welcomeDropZone.addEventListener('click', () => welcomeFileInput.click());
        welcomeDropZone.addEventListener('dragover', (e) => { e.preventDefault(); welcomeDropZone.style.borderColor = '#f59e0b'; });
        welcomeDropZone.addEventListener('dragleave', () => { welcomeDropZone.style.borderColor = '#d97706'; });
        welcomeDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            welcomeDropZone.style.borderColor = '#d97706';
            if (e.dataTransfer.files.length) handleSpecialFile(e.dataTransfer.files[0]);
        });
        welcomeFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleSpecialFile(e.target.files[0]);
        });

        document.getElementById('input-date').addEventListener('input', updateHeaderPreview);
        document.getElementById('input-time').addEventListener('change', updateHeaderPreview);
        document.getElementById('input-couple').addEventListener('input', updateHeaderPreview);
        document.getElementById('input-cd-count').addEventListener('input', updateHeaderPreview);
        document.getElementById('input-dvd-count').addEventListener('input', updateHeaderPreview);

        function handleTimeChange(selectEl) {
            if (selectEl.value === "自由入力...") {
                const custom = prompt("開始時間を入力してください (例: 13:30):", "12:30");
                if (custom) {
                    const newOpt = document.createElement("option");
                    newOpt.value = custom;
                    newOpt.innerText = custom;
                    newOpt.selected = true;
                    selectEl.insertBefore(newOpt, selectEl.lastElementChild);
                    selectEl.value = custom;
                } else {
                    selectEl.value = "12:00";
                }
            }
            updateHeaderPreview();
        }

        function handleSpecialFile(file) {
            const fileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                if (fileName.includes('お見送り') || fileName.includes('送賓')) {
                    parseFarewellData(text);
                } else {
                    parseWelcomeData(text);
                }
                const statusEl = document.getElementById('welcome-status');
                statusEl.innerText = '読み込み完了: ' + fileName;
                statusEl.classList.add('loaded');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function parseWelcomeData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const header = lines[0].split('\t');
            const nameIdx = header.findIndex(h => h.includes('名前') || h.includes('曲名'));
            const artistIdx = header.findIndex(h => h.includes('アーティスト'));

            if (nameIdx === -1) {
                alert('迎賓用ファイルのフォーマットが不整合です。');
                return;
            }

            let textContent = "【迎賓用プレイリスト】\n";
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split('\t');
                const name = cols[nameIdx] || '';
                const artist = artistIdx !== -1 ? (cols[artistIdx] || '') : '';
                if (name) {
                    textContent += `・${name}${artist ? ` / ${artist}` : ''}\n`;
                }
            }

            welcomeMemoContent = textContent;
            welcomeLoaded = true;
            updateMemoTextareaContent();

            if (currentRows.length > 0) syncSpecialRows();
        }

        function parseFarewellData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const header = lines[0].split('\t');
            const nameIdx = header.findIndex(h => h.includes('名前') || h.includes('曲名'));
            const artistIdx = header.findIndex(h => h.includes('アーティスト'));

            if (nameIdx === -1) {
                alert('お見送り用ファイルのフォーマットが不整合です。');
                return;
            }

            let textContent = "\n【お見送り用プレイリスト】\n";
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split('\t');
                const name = cols[nameIdx] || '';
                const artist = artistIdx !== -1 ? (cols[artistIdx] || '') : '';
                if (name) {
                    textContent += `・${name}${artist ? ` / ${artist}` : ''}\n`;
                }
            }

            farewellMemoContent = textContent;
            farewellLoaded = true;
            updateMemoTextareaContent();

            if (currentRows.length > 0) syncSpecialRows();
        }

        function updateMemoTextareaContent() {
            const memoTextarea = document.querySelector('.memo-textarea');
            const combined = (welcomeMemoContent + "\n" + farewellMemoContent).trim();
            if (memoTextarea) {
                memoTextarea.value = combined;
                updatePrintMemoBox(memoTextarea);
            }
        }

        function syncSpecialRows() {
            if (welcomeLoaded) {
                const hasWelcomeRow = currentRows.some(r => r.scene === "迎賓" || r.artist.includes('迎賓'));
                if (!hasWelcomeRow) {
                    currentRows.unshift({
                        id: generateId(),
                        name: "",
                        artist: "（迎賓プレイリストあり）",
                        scene: "迎賓",
                        cue: "",
                        isBlank: false
                    });
                }
            }
            if (farewellLoaded) {
                const hasFarewellRow = currentRows.some(r => r.scene === "送賓" || r.artist.includes('お見送り'));
                if (!hasFarewellRow) {
                    currentRows.push({
                        id: generateId(),
                        name: "",
                        artist: "（お見送りプレイリストあり）",
                        scene: "送賓",
                        cue: "",
                        isBlank: false
                    });
                }
            }
            autoInsertGroupBlankRows();
            renderUI();
        }

        function handleFile(file) {
            parseFileNameInfo(file.name);

            const reader = new FileReader();
            reader.onload = function(e) {
                parseData(e.target.result);
                const statusEl = document.getElementById('main-status');
                statusEl.innerText = '読み込み完了: ' + file.name;
                statusEl.classList.add('loaded');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function parseData(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                alert('有効なデータが見つかりませんでした。');
                return;
            }

            const header = lines[0].split('\t');
            const nameIdx = header.findIndex(h => h.includes('名前') || h.includes('曲名'));
            const artistIdx = header.findIndex(h => h.includes('アーティスト'));

            if (nameIdx === -1) {
                alert('必要な列が見つかりません。iTunesの標準エクスポート形式（.txt）を選択してください。');
                return;
            }

            currentRows = [];

            if (welcomeLoaded) {
                currentRows.push({
                    id: generateId(),
                    name: "",
                    artist: "（迎賓プレイリストあり）",
                    scene: "迎賓",
                    cue: "",
                    isBlank: false
                });
            }

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split('\t');
                const name = cols[nameIdx] || '';
                const artist = artistIdx !== -1 ? (cols[artistIdx] || '') : '';

                if (name) {
                    currentRows.push({ id: generateId(), name, artist, scene: "", cue: "", isBlank: false });
                }
            }

            if (farewellLoaded) {
                currentRows.push({
                    id: generateId(),
                    name: "",
                    artist: "（お見送りプレイリストあり）",
                    scene: "送賓",
                    cue: "",
                    isBlank: false
                });
            }

            autoInsertGroupBlankRows();
            renderUI();
            controlsSection.style.display = 'flex';
        }

        function autoInsertGroupBlankRows() {
            let cleanRows = currentRows.filter(r => !r.isBlank);
            let hasWelcome = cleanRows.some(r => r.scene === "迎賓");
            let newRows = [];

            for (let i = 0; i < cleanRows.length; i++) {
                const curr = cleanRows[i];
                const prev = i > 0 ? cleanRows[i - 1] : null;

                if (!hasWelcome && curr.scene === "入場") {
                    if (newRows.length === 0 || !newRows[newRows.length - 1].isBlank) {
                        newRows.push({ id: generateId(), name: "", artist: "", scene: "", cue: "", isBlank: true });
                    }
                } else if (prev) {
                    const prevGroup = GROUP_MAP[prev.scene] || null;
                    const currGroup = GROUP_MAP[curr.scene] || null;

                    if (prevGroup && currGroup && prevGroup !== currGroup) {
                        if (newRows.length === 0 || !newRows[newRows.length - 1].isBlank) {
                            newRows.push({ id: generateId(), name: "", artist: "", scene: "", cue: "", isBlank: true });
                        }
                    }
                }
                newRows.push(curr);
            }
            currentRows = newRows;
        }

        function insertBlankRow(index) {
            saveCurrentInputs();
            currentRows.splice(index + 1, 0, { id: generateId(), name: "", artist: "", scene: "", cue: "", isBlank: true });
            renderUI();
        }

        function removeRow(index) {
            saveCurrentInputs();
            currentRows.splice(index, 1);
            renderUI();
        }

        function updateSongName(inputEl, idx) {
            currentRows[idx].name = inputEl.value;
            const tr = inputEl.closest('tr');
            if (tr) {
                const printSpan = tr.querySelector('.print-song-name');
                if (printSpan) {
                    printSpan.innerText = inputEl.value;
                    applySongNameScale(printSpan, inputEl.value);
                }
            }
        }

        function updateArtist(inputEl, idx) {
            currentRows[idx].artist = inputEl.value;
            const tr = inputEl.closest('tr');
            if (tr) {
                const printSpan = tr.querySelector('.print-artist-text');
                if (printSpan) printSpan.innerText = inputEl.value;
            }
        }

        function applySongNameScale(spanEl, text) {
            if (!text) {
                spanEl.style.transform = 'scaleX(1)';
                return;
            }
            const maxAllowWidth = 310;
            const measureSpan = document.createElement('span');
            measureSpan.style.visibility = 'hidden';
            measureSpan.style.position = 'absolute';
            measureSpan.style.whiteSpace = 'nowrap';
            measureSpan.style.fontSize = '17px';
            measureSpan.style.fontWeight = '900';
            measureSpan.style.fontFamily = "'Klee One', cursive, sans-serif";
            measureSpan.innerText = text;
            document.body.appendChild(measureSpan);

            const actualWidth = measureSpan.offsetWidth;
            document.body.removeChild(measureSpan);

            if (actualWidth > maxAllowWidth) {
                const scale = maxAllowWidth / actualWidth;
                spanEl.style.transform = `scaleX(${Math.max(scale, 0.5)})`;
            } else {
                spanEl.style.transform = 'scaleX(1)';
            }
        }

        function applySceneScale(spanEl, text) {
            if (!text) {
                spanEl.style.transform = 'scaleX(1)';
                return;
            }
            const maxAllowWidth = 75;
            const measureSpan = document.createElement('span');
            measureSpan.style.visibility = 'hidden';
            measureSpan.style.position = 'absolute';
            measureSpan.style.whiteSpace = 'nowrap';
            measureSpan.style.fontSize = '12px';
            measureSpan.style.fontWeight = '700';
            measureSpan.style.fontFamily = "'Klee One', cursive, sans-serif";
            measureSpan.innerText = text;
            document.body.appendChild(measureSpan);

            const actualWidth = measureSpan.offsetWidth;
            document.body.removeChild(measureSpan);

            if (actualWidth > maxAllowWidth) {
                const scale = maxAllowWidth / actualWidth;
                spanEl.style.transform = `scaleX(${Math.max(scale, 0.5)})`;
            } else {
                spanEl.style.transform = 'scaleX(1)';
            }
        }

        function saveCurrentInputs() {
            const memoTextarea = document.querySelector('.memo-textarea');
            if (memoTextarea) {
                welcomeMemoContent = memoTextarea.value;
            }

            const rows = document.querySelectorAll('#playlist-tbody tr');
            rows.forEach((tr) => {
                const rowId = tr.getAttribute('data-id');
                if (rowId) {
                    const rowData = currentRows.find(r => r.id === rowId);
                    if (rowData && !rowData.isBlank) {
                        const sceneSelect = tr.querySelector('.scene-select');
                        const cueSelect = tr.querySelector('.cue-select');
                        const nameInput = tr.querySelector('.song-name-input');
                        const artistInput = tr.querySelector('.artist-input');

                        if (sceneSelect) rowData.scene = sceneSelect.value;
                        if (cueSelect) rowData.cue = cueSelect.value;
                        if (nameInput) rowData.name = nameInput.value;
                        if (artistInput) rowData.artist = artistInput.value;
                    }
                }
            });
        }

        function getHeaderText() {
            const dateVal = document.getElementById('input-date').value;
            const timeVal = document.getElementById('input-time').value;
            const coupleVal = document.getElementById('input-couple').value;
            const cdCountVal = parseInt(document.getElementById('input-cd-count').value, 10) || 0;
            const dvdCountVal = parseInt(document.getElementById('input-dvd-count').value, 10) || 0;
            
            let processedCouple = coupleVal.trim();
            if (processedCouple) {
                if (!processedCouple.includes('様')) {
                    processedCouple = processedCouple.replace(/([・\s]+)/g, '<span class="honorific-small">様</span>$1') + '<span class="honorific-small">様</span>';
                } else {
                    processedCouple = processedCouple.replace(/様/g, '<span class="honorific-small">様</span>');
                }
            }

            let returnMediaStr = `返却：CD<span class="media-num-large">${cdCountVal}</span>枚`;
            if (dvdCountVal > 0) {
                returnMediaStr += `+DVD<span class="media-num-large">${dvdCountVal}</span>枚`;
            }

            const returnCdText = `<span class="return-cd-print">${returnMediaStr}</span>`;
            const coupleText = `<span class="couple-name-large">${processedCouple}</span> 披露宴BGMプレイリスト ${returnCdText}`;
            
            let formattedDate = dateVal;
            if (dateVal) {
                const parts = dateVal.split('-');
                if (parts.length === 3) {
                    formattedDate = `<span class="num-large">${parseInt(parts[1])}</span>月<span class="num-large">${parseInt(parts[2])}</span>日`;
                }
            }

            let formattedTime = timeVal;
            if (timeVal) {
                const timeParts = timeVal.split(':');
                if (timeParts.length === 2) {
                    formattedTime = `<span class="num-large">${timeParts[0]}</span>:<span class="num-large">${timeParts[1]}</span>`;
                }
            }

            const dateTimeText = (formattedDate || formattedTime) ? `${formattedDate} ${formattedTime}` : '';
            return { coupleText, dateTimeText };
        }

        function updateHeaderPreview() {
            const h2El = document.getElementById('display-title');
            const pEl = document.getElementById('display-datetime');
            if (h2El && pEl) {
                const info = getHeaderText();
                h2El.innerHTML = info.coupleText;
                pEl.innerHTML = info.dateTimeText;
            }
        }

        function updatePrintMemoBox(textarea) {
            const printBox = document.querySelector('.print-memo-container');
            if (!printBox) return;

            const lines = textarea.value.split('\n');
            const containerWidth = 260;

            let baseFontSize = 13;
            let minFontSize = 7;
            let htmlContent = '';
            
            const measureSpan = document.createElement('span');
            measureSpan.style.visibility = 'hidden';
            measureSpan.style.position = 'absolute';
            measureSpan.style.whiteSpace = 'pre';
            measureSpan.style.fontFamily = "'Klee One', cursive, sans-serif";
            document.body.appendChild(measureSpan);

            for (let line of lines) {
                if (!line) {
                    htmlContent += '<div style="height: 10px;"></div>';
                    continue;
                }

                measureSpan.innerText = line;
                let currentSize = baseFontSize;
                measureSpan.style.fontSize = currentSize + 'px';

                while (measureSpan.offsetWidth > containerWidth && currentSize > minFontSize) {
                    currentSize -= 0.5;
                    measureSpan.style.fontSize = currentSize + 'px';
                }

                htmlContent += `<div style="font-size: ${currentSize}px; white-space: pre; line-height: 1.35; overflow: hidden; text-overflow: clip;">${escapeHtml(line)}</div>`;
            }

            document.body.removeChild(measureSpan);
            printBox.innerHTML = htmlContent;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderUI() {
            saveCurrentInputs();
            const info = getHeaderText();
            let optionsHtml = SCENE_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            let cueOptionsHtml = CUE_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join('');

            let html = `
                <div class="print-header">
                    <div id="display-datetime" class="print-datetime">${info.dateTimeText}</div>
                    <h2 id="display-title">${info.coupleText}</h2>
                </div>
                
                <div class="layout-wrapper">
                    <div class="left-panel">
                        <h3>その他プレイリスト・メモ欄</h3>
                        <textarea class="memo-textarea" placeholder="ここに迎賓曲や演出メモを自由に記入できます...">${welcomeMemoContent || (welcomeMemoContent + "\n" + farewellMemoContent).trim()}</textarea>
                        <div class="print-memo-container"></div>
                    </div>

                    <div class="right-panel">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 32px;" class="action-column"></th>
                                    <th class="scene-th">シーン</th>
                                    <th class="song-th">曲名</th>
                                    <th>アーティスト</th>
                                    <th style="width: 120px; text-align: center;" class="action-column">操作</th>
                                </tr>
                            </thead>
                            <tbody id="playlist-tbody">
            `;

            currentRows.forEach((r, idx) => {
                if (r.isBlank) {
                    html += `
                        <tr class="draggable-row" data-id="${r.id}" data-index="${idx}" style="height: 38px; background: rgba(255,255,255,0.01);">
                            <td class="text-center action-column"><span class="drag-handle" draggable="true">☰</span></td>
                            <td class="scene-td"></td>
                            <td></td>
                            <td></td>
                            <td style="text-align: center;" class="action-column">
                                <button class="row-delete-btn" onclick="removeRow(${idx})">削除</button>
                            </td>
                        </tr>
                    `;
                } else {
                    const sceneText = r.scene || '';
                    const cueText = r.cue || '';
                    const songName = escapeHtml(r.name || '');
                    const artistName = escapeHtml(r.artist || '');

                    html += `
                        <tr class="draggable-row" data-id="${r.id}" data-index="${idx}">
                            <td class="text-center action-column"><span class="drag-handle" draggable="true">☰</span></td>
                            <td class="scene-td">
                                <select class="scene-select" onchange="handleSceneChange(this, ${idx})">
                                    <option value="">(選択)</option>
                                    ${optionsHtml}
                                </select>
                                <span class="print-scene-text">${sceneText}</span>
                            </td>
                            <td class="song-name-cell">
                                <input type="text" class="song-name-input" value="${songName}" oninput="updateSongName(this, ${idx})" placeholder="曲名を入力...">
                                <span class="print-song-name">${songName}</span>
                                <span class="print-cue-subtext">${cueText}</span>
                                <div style="margin-top: 4px;">
                                    <select class="cue-select" onchange="updateCustomText(this, 'cue', ${idx})">
                                        <option value="">(再生指示を選択)</option>
                                        ${cueOptionsHtml}
                                    </select>
                                </div>
                            </td>
                            <td>
                                <input type="text" class="artist-input" value="${artistName}" oninput="updateArtist(this, ${idx})" placeholder="アーティスト名...">
                                <span class="print-artist-text">${artistName}</span>
                            </td>
                            <td style="text-align: center; white-space: nowrap;" class="action-column">
                                <button class="row-action-btn" onclick="insertBlankRow(${idx})">＋空白</button>
                                <button class="row-delete-btn" onclick="removeRow(${idx})">削除</button>
                            </td>
                        </tr>
                    `;
                }
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            mainContent.innerHTML = html;

            currentRows.forEach((r, idx) => {
                if (!r.isBlank) {
                    const tr = document.querySelector(`tr[data-id="${r.id}"]`);
                    if (tr) {
                        const printSongSpan = tr.querySelector('.print-song-name');
                        if (printSongSpan) applySongNameScale(printSongSpan, r.name || '');

                        const printSceneSpan = tr.querySelector('.print-scene-text');
                        if (printSceneSpan) applySceneScale(printSceneSpan, r.scene || '');
                    }
                }
            });

            const memoTextarea = document.querySelector('.memo-textarea');
            if (memoTextarea) {
                memoTextarea.addEventListener('input', function() {
                    if (memoDebounceTimer) clearTimeout(memoDebounceTimer);
                    memoDebounceTimer = setTimeout(() => {
                        updatePrintMemoBox(this);
                    }, 150);
                });
                setTimeout(() => updatePrintMemoBox(memoTextarea), 50);
            }

            currentRows.forEach((r, idx) => {
                if (!r.isBlank) {
                    const tr = document.querySelector(`tr[data-id="${r.id}"]`);
                    if (tr) {
                        const sceneSelect = tr.querySelector('.scene-select');
                        const cueSelect = tr.querySelector('.cue-select');
                        if (sceneSelect && r.scene) {
                            if (!Array.from(sceneSelect.options).some(o => o.value === r.scene)) {
                                const customOpt = document.createElement("option");
                                customOpt.value = r.scene;
                                customOpt.innerText = r.scene;
                                customOpt.selected = true;
                                sceneSelect.insertBefore(customOpt, sceneSelect.lastElementChild);
                            }
                            sceneSelect.value = r.scene;
                            const spanEl = sceneSelect.nextElementSibling;
                            spanEl.innerText = r.scene;
                            applySceneScale(spanEl, r.scene);
                        }
                        if (cueSelect && r.cue) {
                            if (!Array.from(cueSelect.options).some(o => o.value === r.cue)) {
                                const customOpt = document.createElement("option");
                                customOpt.value = r.cue;
                                customOpt.innerText = r.cue;
                                customOpt.selected = true;
                                cueSelect.insertBefore(customOpt, cueSelect.lastElementChild);
                            }
                            cueSelect.value = r.cue;
                        }
                    }
                }
            });

            initDragAndDrop();
        }

        function handleSceneChange(selectEl, idx) {
            updateCustomText(selectEl, 'scene', idx);

            if (autoInsertTimer) clearTimeout(autoInsertTimer);

            autoInsertTimer = setTimeout(() => {
                saveCurrentInputs();
                autoInsertGroupBlankRows();
                renderUI();
            }, 250);
        }

        function updateCustomText(selectEl, type, idx) {
            if (type === 'scene' && selectEl.value === "自由入力...") {
                const custom = prompt("シーン名を入力してください:", "");
                if (custom) {
                    const newOpt = document.createElement("option");
                    newOpt.value = custom;
                    newOpt.innerText = custom;
                    newOpt.selected = true;
                    selectEl.insertBefore(newOpt, selectEl.lastElementChild);
                    currentRows[idx].scene = custom;
                    const spanEl = selectEl.nextElementSibling;
                    spanEl.innerText = custom;
                    applySceneScale(spanEl, custom);
                } else {
                    selectEl.value = "";
                    currentRows[idx].scene = "";
                    const spanEl = selectEl.nextElementSibling;
                    spanEl.innerText = "";
                    spanEl.style.transform = 'scaleX(1)';
                }
            } else if (type === 'cue' && selectEl.value === "時間指定 / 複数選択...") {
                openCueModal(selectEl, idx);
            } else if (type === 'cue' && selectEl.value === "指示をクリア") {
                currentRows[idx].cue = "";
                selectEl.value = "";
                const tr = selectEl.closest('tr');
                const cueSubSpan = tr.querySelector('.print-cue-subtext');
                if (cueSubSpan) cueSubSpan.innerText = "";
            } else {
                if (type === 'scene') {
                    currentRows[idx].scene = selectEl.value;
                    const spanEl = selectEl.nextElementSibling;
                    spanEl.innerText = selectEl.value;
                    applySceneScale(spanEl, selectEl.value);
                }
                if (type === 'cue') {
                    currentRows[idx].cue = selectEl.value;
                    const tr = selectEl.closest('tr');
                    const cueSubSpan = tr.querySelector('.print-cue-subtext');
                    if (cueSubSpan) cueSubSpan.innerText = selectEl.value;
                }
            }
        }

        function openCueModal(selectEl, idx) {
            activeTimeSelectEl = selectEl;
            activeTimeRowIdx = idx;
            selectedCueSequence = [];

            const existingCue = currentRows[idx].cue || "";
            if (existingCue) {
                const parts = existingCue.split(/\s*[\/➔]\s*/);
                parts.forEach(p => {
                    if (p.trim()) {
                        selectedCueSequence.push(p.trim());
                    }
                });
            }

            document.getElementById('modal-free-input').value = "";
            document.getElementById('time-builder-box').classList.remove('active');
            renderSequenceList();
            document.getElementById('time-modal').classList.add('active');
        }

        function addStandardCue(cueName) {
            selectedCueSequence.push(cueName);
            renderSequenceList();
        }

        function toggleTimeBuilder() {
            const builder = document.getElementById('time-builder-box');
            builder.classList.toggle('active');
            if (builder.classList.contains('active')) {
                document.getElementById('builder-sec-input').focus();
            }
        }

        function selectPresetWord(word) {
            document.getElementById('builder-keyword-input').value = word;
        }

        function commitTimeCue() {
            const minVal = parseInt(document.getElementById('builder-min-input').value, 10) || 0;
            const secVal = parseInt(document.getElementById('builder-sec-input').value, 10) || 0;
            const keywordVal = document.getElementById('builder-keyword-input').value.trim();

            const timeStr = `${minVal}'${String(secVal).padStart(2, '0')}"`;
            const timeCue = keywordVal ? `${timeStr}～${keywordVal}` : `${timeStr}～`;

            selectedCueSequence.push(timeCue);
            renderSequenceList();
            document.getElementById('time-builder-box').classList.remove('active');
        }

        function moveSequenceItem(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= selectedCueSequence.length) return;
            const item = selectedCueSequence.splice(index, 1)[0];
            selectedCueSequence.splice(targetIndex, 0, item);
            renderSequenceList();
        }

        function removeSequenceItem(index) {
            selectedCueSequence.splice(index, 1);
            renderSequenceList();
        }

        function clearSequence() {
            selectedCueSequence = [];
            renderSequenceList();
        }

        function renderSequenceList() {
            const box = document.getElementById('sequence-list-box');
            if (!box) return;

            if (selectedCueSequence.length === 0) {
                box.innerHTML = '<div style="color: var(--text-sub); font-size: 12px; text-align: center; padding: 10px;">（指示が選択されていません）</div>';
                return;
            }

            let html = '';
            selectedCueSequence.forEach((item, idx) => {
                html += `
                    <div class="sequence-item">
                        <span>${idx + 1}. ${escapeHtml(item)}</span>
                        <div class="seq-btn-group">
                            ${idx > 0 ? `<button type="button" class="seq-move-btn" onclick="moveSequenceItem(${idx}, -1)">▲</button>` : ''}
                            ${idx < selectedCueSequence.length - 1 ? `<button type="button" class="seq-move-btn" onclick="moveSequenceItem(${idx}, 1)">▼</button>` : ''}
                            <button type="button" class="seq-del-btn" onclick="removeSequenceItem(${idx})">✕</button>
                        </div>
                    </div>
                `;
            });
            box.innerHTML = html;
        }

        function closeTimeModal(isConfirmed) {
            const modal = document.getElementById('time-modal');
            modal.classList.remove('active');

            if (isConfirmed && activeTimeSelectEl && activeTimeRowIdx !== null) {
                let cueParts = [...selectedCueSequence];

                const freeVal = document.getElementById('modal-free-input').value.trim();
                if (freeVal) {
                    cueParts.push(freeVal);
                }

                const finalVal = cueParts.join(' / ');

                if (finalVal) {
                    if (!Array.from(activeTimeSelectEl.options).some(o => o.value === finalVal)) {
                        const newOpt = document.createElement("option");
                        newOpt.value = finalVal;
                        newOpt.innerText = finalVal;
                        newOpt.selected = true;
                        activeTimeSelectEl.insertBefore(newOpt, activeTimeSelectEl.lastElementChild);
                    }
                    activeTimeSelectEl.value = finalVal;
                    currentRows[activeTimeRowIdx].cue = finalVal;
                } else {
                    activeTimeSelectEl.value = "";
                    currentRows[activeTimeRowIdx].cue = "";
                }

                const tr = activeTimeSelectEl.closest('tr');
                const cueSubSpan = tr.querySelector('.print-cue-subtext');
                if (cueSubSpan) cueSubSpan.innerText = finalVal;
            } else if (!isConfirmed && activeTimeSelectEl) {
                activeTimeSelectEl.value = currentRows[activeTimeRowIdx].cue || "";
            }

            activeTimeSelectEl = null;
            activeTimeRowIdx = null;
        }

        function initDragAndDrop() {
            const tbody = document.getElementById('playlist-tbody');
            if (!tbody) return;
            const rows = tbody.querySelectorAll('tr.draggable-row');

            rows.forEach(row => {
                const handle = row.querySelector('.drag-handle');
                if (!handle) return;

                handle.addEventListener('dragstart', (e) => {
                    draggedIndex = parseInt(row.getAttribute('data-index'));
                    setTimeout(() => row.classList.add('dragging'), 0);
                });

                handle.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    rows.forEach(r => r.classList.remove('drag-over'));
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const targetRow = e.target.closest('tr');
                    if (targetRow && targetRow !== row) {
                        rows.forEach(r => r.classList.remove('drag-over'));
                        targetRow.classList.add('drag-over');
                    }
                });

                row.addEventListener('drop', (e) => {
                    e.preventDefault();
                    saveCurrentInputs();
                    const targetRow = e.target.closest('tr');
                    if (targetRow) {
                        const targetIndex = parseInt(targetRow.getAttribute('data-index'));
                        if (draggedIndex !== null && draggedIndex !== targetIndex) {
                            const movedItem = currentRows.splice(draggedIndex, 1)[0];
                            currentRows.splice(targetIndex, 0, movedItem);
                            renderUI();
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
